name: Windows offline installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONNOUSERSITE: '1'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Locate pip download cache
        id: pip-cache
        run: '"path=$(python -m pip cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache package downloads and model weights
        id: downloads-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.pip-cache.outputs.path }}
            local-data/models
            local-data/windows-downloads
            local-data/extension-downloads
          key: windows-installer-${{ hashFiles('mise.toml', 'requirements-*.txt', 'packaging/windows/inputs.json', 'packaging/extra-markups.json', 'PneumoconiosisAnnotator/PneumoconiosisLib/model_config.py') }}
          restore-keys: windows-installer-

      - name: Prepare build runtime
        run: python scripts/prepare_runtime.py

      - name: Install synthetic test dependencies
        run: '& .\.venv\Scripts\python.exe -m pip install -r requirements-test.txt'

      - name: Test application core
        run: '& .\.venv\Scripts\python.exe -m unittest discover -s tests -v'

      - name: Build the offline installer
        run: '& .\.venv\Scripts\python.exe scripts/build_windows_installer.py'

      - name: Free the build-only virtual environment
        run: Remove-Item .venv -Recurse -Force

      - name: Verify offline installation, GUI, backend, reinstall and uninstall
        run: '& .\local-data\windows-build\PneumoconiosisAnnotator\runtime\python\python.exe -I -B -X utf8 scripts/test_windows_installer.py'

      - name: Save installer in an unpublished release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = Get-Content local-data/windows-release/build-manifest.json -Raw | ConvertFrom-Json
          $tag = "windows-v$($build.version)-$($build.commit.Substring(0,7))-r${{ github.run_number }}"
          $notes = @"
          Windows x64 offline installer for the pneumoconiosis research annotator.

          Commit: $($build.commit)
          Includes the pinned Slicer build, matching ExtraMarkups circle tools, a standalone Python runtime, CPU model and audio dependencies, and verified model weights.
          Starts empty: choose the chest-image directory, then explicitly create or open an annotation project. Source/project paths and save status remain visible; closing saves the project without Slicer's scene-save prompt.
          Twelve discrete rating cells are grouped into four major levels; clicking a cell jumps directly to that grade. Native circles display diameter and polygons display width.
          Lung segmentation displays a full-window progress overlay until the result is rendered and saved. Mouse/keyboard input, image interaction, shortcuts, directory drops and close requests are blocked; startup, worker and result-validation failures restore input and allow retry.
          Research delivery exports all participating readers, annotations, attachments, image index and a manifest, without original DICOM images. LabelMe PNG/JSON export is a separate button.
          Legacy point/ellipse annotations are not converted to circles; use a separate new project when the unsupported-annotation message appears. Existing files remain intact.
          Installer minimum: $($build.windows.minimum_release) x64 ($($build.windows.minimum_version)), based on Slicer's UTF-8 path requirements. This is a compatibility target; Windows 10 client versions still require on-device verification.
          Windows transitive dependencies are pinned to the previously delivered package. The minimum requirement is independent of the build runner's OS version.
          Load an external DICOM reference folder and compare standards beside the current case with independent viewing controls; reference images are not bundled.
          Installer, offline backend, normal GUI startup, UTF-8 process code page, single-instance protection, Unicode folder picker with Mac ZIP metadata, model/export, reinstall and uninstall checks passed on Windows Server 2022 x64. GUI checks use software rendering; this does not establish Windows 10 client compatibility.
          Reference comparison checks cover OT/CR loading, file navigation, independent window/level and zoom, case/markup isolation, and remembered or missing external folders.
          Bundles Chinese Slicer, CTK and Qt translations for offline use. Checks cover Chinese native widgets, folder drag-and-drop into the annotation workflow, one-click return from native modules, and UTF-8/GB18030 DICOM text decoding with synthetic metadata.
          Installed GUI checks also exercise direct slider clicks, the compiled circle extension and actual offline LabelMe export. Separate normal processes verify project creation/reopening, save-failure exit protection, persisted pending changes and absence of scene-save prompts.
          Segmentation regression checks exercise real input events, worker termination, startup failure, worker error, rejected results and successful inference with the interface locked through persistence.
          Annotation data lives outside the program installation directory and is retained on uninstall.
          The installer is unsigned. Physical GPU, microphone and clinician acceptance remain separate.
          "@
          $notes | Set-Content local-data/windows-release/release-notes.md -Encoding utf8
          $assets = Get-ChildItem local-data/windows-release -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object { $_.FullName }
          gh release create $tag @assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft --title "Windows $($build.version) · $($build.commit.Substring(0,7))" --notes-file local-data/windows-release/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Draft release: $tag" >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve downloads for the next build
        if: ${{ !cancelled() && steps.downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.pip-cache.outputs.path }}
            local-data/models
            local-data/windows-downloads
            local-data/extension-downloads
          key: windows-installer-${{ hashFiles('mise.toml', 'requirements-*.txt', 'packaging/windows/inputs.json', 'packaging/extra-markups.json', 'PneumoconiosisAnnotator/PneumoconiosisLib/model_config.py') }}

      - name: Upload small failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-diagnostics-${{ github.run_attempt }}
          path: |
            local-data/qa/windows-installer/
            local-data/windows-release/build-manifest.json
          retention-days: 3
          if-no-files-found: warn
